allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

# GHSA-frvp-7c67-39w9: @hono/node-server path traversal (Windows, serve-static).
# Transitive via @modelcontextprotocol/sdk's Node adapter — never executed on
# Workers. SDK pins <2; drop this ignore when it moves to node-server >=2.0.5.
#
# GHSA-6qxp-vccf-f47h: MCP TypeScript SDK OAuth client could send credentials
# to an auth server chosen by the MCP server. Reached via agents, which pins
# @modelcontextprotocol/client as an exact (non-range) peer dependency at the
# vulnerable 2.0.0 - no released agents version currently permits the patched
# 2.2.0+. Left open on GitHub's Dependabot alerts as the tracking surface;
# drop this ignore once agents bumps that peer pin.
auditConfig:
  ignoreGhsas:
    - GHSA-frvp-7c67-39w9
    - GHSA-6qxp-vccf-f47h

# agents@0.28.0 fixes the source-map-js DoS CVE (GHSA-68fv-2mgg-jv7q) pulled in
# via its vite/postcss chain at 0.23.0. Exclude it from the release-age gate so
# that fix lands now; drop this once the release has aged past the gate itself.
minimumReleaseAgeExclude:
  - agents@0.28.0

# GHSA-2v37-7h3g-55p8: nanoid custom generators loop on size 0. Reached only
# through vite -> postcss (a build-time path), and `pnpm update` won't move the
# transitive past postcss's resolved pin. Stay on 3.x: postcss requires it as CJS.
overrides:
  "nanoid@<3.3.18": "^3.3.18"
  # GHSA-fxqj-rqcc-2cmp: same vite -> postcss path; vite resolves it one patch short.
  "postcss@<8.5.23": "^8.5.23"
